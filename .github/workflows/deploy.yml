# Scheduled collector; keep this workflow on the default branch.
name: GameStats collector and deploy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gamestats-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Collect Roblox statistics
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/collect.py

      - name: Commit updated statistics
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name "GameStats Bot"
            git config user.email "gamestats-bot@users.noreply.github.com"
            git add data.json
            git commit -m "Update Roblox game statistics"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
